spring.application.name=product.service
# Use environment variables with localhost defaults so IntelliJ runs use host Mongo
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/product_db}
spring.data.mongodb.username=${SPRING_DATA_MONGODB_USERNAME:appuser}
spring.data.mongodb.password=${SPRING_DATA_MONGODB_PASSWORD:apppass}
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
server.port=0

spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

#Actuator Prometheus Endpoint
management.endpoints.web.exposure.include=prometheus
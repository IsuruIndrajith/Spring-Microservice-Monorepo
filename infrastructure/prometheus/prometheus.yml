global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: discovery-server
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ["discovery-server:8761"]

  - job_name: product-service
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ["product-service:8082"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ["inventory-service:8083"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ["order-service:8081"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ["notification-service:8084"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ["api-gateway:8090"]

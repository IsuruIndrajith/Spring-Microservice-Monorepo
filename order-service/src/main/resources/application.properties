spring.application.name=order.service

# Use environment variables when available, fall back to localhost defaults for IntelliJ runs
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppass}

spring.jpa.hibernate.ddl-auto=update
# Explicit Hibernate dialect to avoid dialect detection failures when JDBC metadata
# is not available during startup.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8081
inventory.service.url=http://inventory-service
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

#Kafka Properties
spring.kafka.bootstrap.servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value.serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Actuator Prometheus Endpoint
management.endpoints.web.exposeure.include= prometheus